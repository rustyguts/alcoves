name: Website

# Build the marketing + docs site (website/) and deploy it to GitHub Pages.
# Builds run on pushes to main and on PRs (validation); deploys happen only on
# pushes to main. The site is served from the apex domain alcoves.io (CNAME in
# website/public/CNAME), so no Astro `base` path is needed.

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/website.yml'
  pull_request:
    paths:
      - 'website/**'
      - '.github/workflows/website.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    # Cancel superseded builds for the same ref, but never a `main` deployment
    # (the deploy job has its own `pages` group below).
    concurrency:
      group: website-build-${{ github.ref }}
      cancel-in-progress: true
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('website/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type & content check
        run: bun run check

      - name: Build
        run: bun run build

      # The Pages steps need `pages: write` / `id-token: write`, which aren't
      # granted to forked-PR runs — so only run them when actually deploying
      # (push to main). PRs stop after the build above for validation.
      - name: Configure GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          # `path` is resolved from the repo root, NOT the job working-directory.
          path: website/dist

  deploy:
    # Only deploy from main; PRs run the build job above for validation only.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    # Serialize deployments; never cancel an in-progress publish.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
