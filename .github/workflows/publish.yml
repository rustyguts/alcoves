name: Docker Image

on:
  push:
    branches: ["main", "dev"]
    tags:
      - "v*"
  pull_request:
  release:
    types: [published]

jobs:
  build:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-images.yml
    with:
      # Don't push on PRs — just verify the images build.
      push: ${{ github.event_name != 'pull_request' }}
