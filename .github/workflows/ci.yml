name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  unit-and-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Run unit tests with coverage
        run: bun run test:unit:coverage

      - name: Print coverage summary
        run: bun run coverage:summary

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: error

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_DB: alcoves
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5455:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15

      dragonfly:
        image: docker.dragonflydb.io/dragonflydb/dragonfly:latest
        ports:
          - 6389:6379

    env:
      ALCOVES_DATABASE_URL: postgres://postgres:postgres@localhost:5455/alcoves
      ALCOVES_SESSION_SECRET: alcoves-ci-secret-key-for-e2e-testing!!
      ALCOVES_STORAGE_DRIVER: local
      ALCOVES_STORAGE_PATH: ./data
      ALCOVES_QUEUE_HOST: localhost
      ALCOVES_QUEUE_PORT: 6389

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium

      - name: Run E2E tests
        run: bun run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
