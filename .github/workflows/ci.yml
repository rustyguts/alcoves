name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  backend-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_DB: alcoves_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5455:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15

      # Dragonfly (Redis-compatible) backs the Asynq queue. The handler/service
      # tests enqueue jobs and assert the enqueue succeeded, so they need a live
      # broker on localhost:6389 (mirrors docker-compose + the e2e job).
      dragonfly:
        image: docker.dragonflydb.io/dragonflydb/dragonfly:latest
        # Asynq's Inspector/GetQueueInfo Lua scripts touch keys not declared in
        # KEYS[]; Dragonfly rejects that by default. Allow it (mirrors
        # docker-compose's `--default_lua_flags=allow-undeclared-keys`). GitHub
        # service containers can't override the command, but Dragonfly reads
        # flags from DFLY_-prefixed env vars.
        env:
          DFLY_default_lua_flags: allow-undeclared-keys
        ports:
          - 6389:6379

    env:
      ALCOVES_DATABASE_URL: postgres://postgres:postgres@localhost:5455/alcoves_test
      ALCOVES_SESSION_SECRET: alcoves-ci-secret-key-for-go-tests!!
      ALCOVES_STORAGE_DRIVER: local
      ALCOVES_STORAGE_PATH: ./data
      ALCOVES_QUEUE_HOST: localhost
      ALCOVES_QUEUE_PORT: 6389

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Install libvips + ffmpeg
        run: |
          sudo apt-get update
          # ffmpeg powers the audio extraction in the waveform, audio-event
          # detection, and transcription real-data tests.
          sudo apt-get install -y libvips-dev libheif-plugin-aomenc libheif-plugin-x265 ffmpeg

      - name: Install ONNX Runtime
        run: |
          # Must match the API version onnxruntime_go links against (ORT 1.25.x /
          # API v25). An older runtime fails ONNX init with
          # "requested API version [25] is not available", which would skip every
          # real face/object/audio inference test.
          ONNX_VERSION=1.25.0
          ARCH=$(dpkg --print-architecture)
          if [ "$ARCH" = "arm64" ]; then ONNX_ARCH="aarch64"; else ONNX_ARCH="x64"; fi
          wget -q "https://github.com/microsoft/onnxruntime/releases/download/v${ONNX_VERSION}/onnxruntime-linux-${ONNX_ARCH}-${ONNX_VERSION}.tgz"
          tar -xzf "onnxruntime-linux-${ONNX_ARCH}-${ONNX_VERSION}.tgz"
          sudo cp -r "onnxruntime-linux-${ONNX_ARCH}-${ONNX_VERSION}/lib/"* /usr/local/lib/
          sudo cp -r "onnxruntime-linux-${ONNX_ARCH}-${ONNX_VERSION}/include/"* /usr/local/include/
          sudo ln -sf /usr/local/lib/libonnxruntime.so /usr/local/lib/onnxruntime.so
          sudo ldconfig
          rm -rf "onnxruntime-linux-${ONNX_ARCH}-${ONNX_VERSION}"*

      - name: Build whisper.cpp (whisper-cli)
        run: |
          # Build the same whisper.cpp release the Docker image ships so the
          # transcription real-data test runs against the real binary. Models are
          # downloaded at test time.
          WHISPER_VERSION=v1.8.4
          git clone --depth 1 --branch "${WHISPER_VERSION}" https://github.com/ggerganov/whisper.cpp.git /tmp/whisper.cpp
          cmake -S /tmp/whisper.cpp -B /tmp/whisper.cpp/build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON
          cmake --build /tmp/whisper.cpp/build -j --config Release
          sudo install -m 0755 /tmp/whisper.cpp/build/bin/whisper-cli /usr/local/bin/whisper-cli
          sudo find /tmp/whisper.cpp/build -name 'libwhisper.so*' -exec cp -a {} /usr/local/lib/ \;
          sudo find /tmp/whisper.cpp/build -name 'libggml*.so*' -exec cp -a {} /usr/local/lib/ \;
          sudo ldconfig
          rm -rf /tmp/whisper.cpp

      - name: Download Go modules
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        # -p 1 forces sequential package execution. Multiple packages
        # (internal/handlers, internal/services/files) share the single test
        # postgres and TRUNCATE/DELETE the same tables; running them in parallel
        # causes FK violations and deadlocks between concurrent test runs.
        run: go test ./... -race -count=1 -p 1

  unit-and-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Run unit tests with coverage
        run: bun run test:unit:coverage

      - name: Print coverage summary
        run: bun run coverage:summary

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: frontend/coverage/
          if-no-files-found: error

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: frontend

    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_DB: alcoves
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5455:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15

      dragonfly:
        image: docker.dragonflydb.io/dragonflydb/dragonfly:latest
        ports:
          - 6389:6379

    env:
      ALCOVES_DATABASE_URL: postgres://postgres:postgres@localhost:5455/alcoves
      ALCOVES_SESSION_SECRET: alcoves-ci-secret-key-for-e2e-testing!!
      ALCOVES_STORAGE_DRIVER: local
      ALCOVES_STORAGE_PATH: ./data
      ALCOVES_QUEUE_HOST: localhost
      ALCOVES_QUEUE_PORT: 6389

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium

      - name: Run E2E tests
        run: bunx playwright test --shard=${{ matrix.shard }}/4

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: playwright-report/
          if-no-files-found: ignore
