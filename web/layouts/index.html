{{define "title"}}{{.title}}{{end}}

{{define "body"}}
<div class="drawer lg:drawer-open">
  <input id="drawer-sidebar-toggle" type="checkbox" class="drawer-toggle" />
  <div class="bg-base-300 drawer-content flex flex-col">
    <div class="navbar bg-base-300 sticky top-0 z-30">
      <div class="flex-none lg:hidden">
        <label for="drawer-sidebar-toggle" aria-label="open sidebar" class="btn btn-square btn-ghost">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
            class="inline-block h-6 w-6 stroke-current">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
          </svg>
        </label>
      </div>
      <div class="flex justify-end w-full">
        <div class="mr-4">
          {{template "upload-modal" .}}
          <button class="btn btn-ghost mr-2" onclick="upload_modal.showModal()">Upload</button>
          <div class="dropdown dropdown-end mr-4">
            <div tabindex="0" role="button" class="btn btn-ghost m-1">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                class="inline-block h-5 w-5 stroke-current">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M7 21a4 4 0 01-4-4V5a2 2 0 012-2h4a2 2 0 012 2v12a4 4 0 01-4 4zm0 0h12a2 2 0 002-2v-4a2 2 0 00-2-2h-2.343M11 7.343l1.657-1.657a2 2 0 012.828 0l2.829 2.829a2 2 0 010 2.828l-8.486 8.485M7 17h.01">
                </path>
              </svg>
              <span class="hidden md:inline">Theme</span>
            </div>
            <ul tabindex="0" class="dropdown-content z-[1] mt-2 w-52 p-2 shadow-lg bg-base-200 rounded-box">
              <li>
                <input type="radio" name="theme-dropdown"
                  class="theme-controller btn btn-sm btn-ghost btn-block justify-start" aria-label="Light"
                  value="light" />
              </li>
              <li>
                <input type="radio" name="theme-dropdown"
                  class="theme-controller btn btn-sm btn-ghost btn-block justify-start" aria-label="Dark"
                  value="dark" />
              </li>
              <li>
                <input type="radio" name="theme-dropdown"
                  class="theme-controller btn btn-sm btn-ghost btn-block justify-start" aria-label="Cupcake"
                  value="cupcake" />
              </li>
              <li>
                <input type="radio" name="theme-dropdown"
                  class="theme-controller btn btn-sm btn-ghost btn-block justify-start" aria-label="Sunset"
                  value="sunset" />
              </li>
            </ul>
          </div>
          <div class="dropdown dropdown-end">
            <div tabindex="0" role="button" class="btn btn-ghost btn-circle avatar avatar-placeholder">
              <div class="bg-neutral text-neutral-content w-12 rounded-full">
                <span class="text-xl">{{.User}}</span>
              </div>
            </div>
            <ul tabindex="0" class="menu menu-sm dropdown-content bg-base-100 rounded-box z-[1] mt-3 w-52 p-2 shadow">
              <li>
                <a class="justify-between">
                  Account
                </a>
              </li>
              <li>
                <form action="/logout" method="post">
                  <button type="submit">Log Out</button>
                </form>
              </li>
            </ul>
          </div>
        </div>
      </div>
    </div>
    <div class="flex flex-col h-[calc(100vh-64px)] px-4 pb-4">
      <div class="p-4 rounded-xl bg-base-200 overflow-y-auto flex-1 pr-2">
        <style>
          .photo-gallery {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
          }

          .photo-item {
            height: 240px;
            flex-grow: 1;
            position: relative;
            overflow: hidden;
            border-radius: 0.5rem;
            background-color: var(--b1);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
          }

          .photo-item img {
            height: 100%;
            width: 100%;
            object-fit: cover;
            min-width: 100%;
          }

          .photo-item::after {
            content: '';
            display: block;
            padding-bottom: 100%;
          }

          .photo-info {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to bottom, rgba(0, 0, 0, 0.4), transparent);
            padding: 1rem 0.75rem 0.75rem;
            color: white;
            opacity: 0;
            transition: opacity 0.3s ease;
          }

          .photo-item:hover .photo-info {
            opacity: 1;
          }

          .photo-title {
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 0.25rem;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
          }

          .photo-date {
            font-size: 0.75rem;
            opacity: 0.9;
          }

          /* Last row handling - prevents excessive stretching */
          .photo-gallery::after {
            content: '';
            flex-grow: 999;
          }
        </style>

        <div class="photo-gallery">
          {{range .Assets}}
          <a href="/media/{{.PublicID}}" class="photo-item">
            <img src="/assets/{{.PublicID}}?width=500" alt="{{.Filename}}" loading="lazy" />
            <div class="photo-info"></div>
          </a>
          {{end}}
        </div>
      </div>
    </div>
  </div>
  <div class="drawer-side">
    <label for="drawer-sidebar-toggle" aria-label="close sidebar" class="drawer-overlay"></label>
    <ul class="menu bg-base-300 text-base-content min-h-full min-w-[240px] p-4">
      <li><a href="/" class="text-2xl">Alcoves</a></li>
      <li class="text-lg"><a href="/" class="menu-item">Home</a></li>
    </ul>
  </div>
</div>
{{end}}
