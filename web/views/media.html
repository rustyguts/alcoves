{{define "title"}}Media - Alcoves{{end}}

{{define "body"}}
<div class="m-0 p-0 h-full w-full top-0 left-0 absolute">
  <div style='background-color: black !important;' class="flex w-full h-full justify-center items-center">
    <img src="/assets/{{.Asset.PublicID}}?width=2000" alt="{{.Asset.Filename}}"
      class="max-h-screen max-w-full object-contain mx-auto" />
  </div>
  <div class="absolute top-0 left-0 h-screen w-screen flex items-center justify-center">
    <h1 class="text-2xl font-bold">{{.Asset.Filename}}</h1>
    <p class="text-sm">{{.Asset.CTime.Format "Jan 02, 2006 15:04"}}</p>
  </div>
</div>
{{end}}
