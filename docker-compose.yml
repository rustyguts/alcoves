services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    environment:
      OTEL_SERVICE_NAME: alcoves
      OTEL_RESOURCE_ATTRIBUTES: service.name=alcoves,service.namespace=alcoves
      OTEL_EXPORTER_OTLP_ENDPOINT: http://localhost:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      # OTEL_EXPORTER_OTLP_HEADERS: "signoz-ingestion-key=1234"
      # ALCOVES_MEDIA_PATH: /data/media
      ALCOVES_ENABLE_TRACING: false
      ALCOVES_DB_PATH: /data/alcoves.db
    volumes:
      - .:/app
      - data:/data
    ports:
      - 3000:3000

volumes:
  data:
