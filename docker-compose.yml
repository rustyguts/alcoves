services:
  postgres:
    image: pgvector/pgvector:pg18
    environment:
      - POSTGRES_DB=alcoves
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 1s
      timeout: 5s
      retries: 30

  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:latest
    command: ["dragonfly", "--default_lua_flags=allow-undeclared-keys"]
    ports:
      - "6389:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 1s
      timeout: 5s
      retries: 30

  backend:
    build:
      context: ./backend
    environment:
      - PORT=3001
      - ALCOVES_DATABASE_URL=postgres://postgres:postgres@postgres:5432/alcoves?sslmode=disable
      - ALCOVES_QUEUE_HOST=dragonfly
      - ALCOVES_QUEUE_PORT=6379
      - LD_LIBRARY_PATH=/usr/local/lib
      # Load dev/test seed data when the database is empty (see internal/seed).
      # Safe on every boot: it no-ops once any user exists. Local-dev only —
      # never set in real deployments, so real first-time setups are untouched.
      - ALCOVES_SEED=true
    env_file:
      - .env
    volumes:
      - ./backend:/app
      # Mount the repo's .git directory so `go build`'s VCS detection
      # embeds vcs.revision, surfacing the commit SHA at /api/version.
      # Read-only — container must never write to the host repo.
      - ./.git:/app/.git:ro
      - go_mod_cache:/go/pkg/mod
      - go_build_cache:/root/.cache/go-build
      - ./data:/app/data
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      dragonfly:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      - ALCOVES_API_URL=http://backend:3001
      - NITRO_HOST=0.0.0.0
      - NITRO_PORT=3000
      - HOME=/tmp
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      # Anonymous volumes shadow the bind mount so host-side build artifacts
      # (generated when running bun dev/typecheck/playwright on the host)
      # never leak in — they bake host-absolute node_modules paths that don't
      # resolve inside the container and crash the dev server.
      - /app/.nuxt
      - /app/.output
    ports:
      - "3000:3000"
    depends_on:
      - backend
    healthcheck:
      test:
        - "CMD"
        - "bun"
        - "-e"
        - "await fetch('http://localhost:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 120s

volumes:
  postgres_data:
  go_mod_cache:
  go_build_cache:
  frontend_node_modules:
