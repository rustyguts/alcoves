services:
  app:
    build:
      context: .
      target: development
      args:
        - TAILWIND_CSS_BINARY=$TAILWIND_CSS_BINARY
    environment:
      - ALCOVES_DATABASE_URL=postgres://postgres:postgres@postgres:5432/alcoves?sslmode=disable
    volumes:
      - .:/app
      - ./data:/app/data
    ports:
      - 3000:8080
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:18
    environment:
      - POSTGRES_DB=alcoves
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 1s
      timeout: 5s
      retries: 30

  e2e:
    profiles: ["e2e"]
    build:
      context: .
      dockerfile: e2e/Dockerfile
    environment:
      - CI=true

volumes:
  postgres_data:
