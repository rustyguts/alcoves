services:
  postgres:
    image: pgvector/pgvector:pg18
    environment:
      - POSTGRES_DB=alcoves
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 1s
      timeout: 5s
      retries: 30

  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:latest
    command: ["dragonfly", "--default_lua_flags=allow-undeclared-keys"]
    ports:
      - "6389:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 1s
      timeout: 5s
      retries: 30

  backend:
    build:
      context: ./backend
    environment:
      - PORT=3001
      - ALCOVES_DATABASE_URL=postgres://postgres:postgres@postgres:5432/alcoves?sslmode=disable
      - ALCOVES_QUEUE_HOST=dragonfly
      - ALCOVES_QUEUE_PORT=6379
      - LD_LIBRARY_PATH=/usr/local/lib
      # Load dev/test seed data when the database is empty (see internal/seed).
      # Safe on every boot: it no-ops once any user exists. Local-dev only —
      # never set in real deployments, so real first-time setups are untouched.
      - ALCOVES_SEED=true
      # Enable the MCP HTTP transport + OAuth 2.1 authorization server so the
      # consent screen (/oauth/authorize) and profile "Connected apps" panel are
      # exercisable (and e2e-testable) locally. Both are local-dev convenience
      # toggles — real deployments opt in explicitly. Issuer is the dev front door.
      - ALCOVES_MCP_HTTP_ENABLED=true
      - ALCOVES_MCP_OAUTH_ENABLED=true
      - ALCOVES_BASE_URL=http://localhost:3000
    env_file:
      # Optional so the stack still comes up without a local .env (e.g. in CI,
      # which writes a minimal one for the e2e job).
      - path: .env
        required: false
    volumes:
      - ./backend:/app
      # Mount the repo's .git directory so `go build`'s VCS detection
      # embeds vcs.revision, surfacing the commit SHA at /api/version.
      # Read-only — container must never write to the host repo.
      - ./.git:/app/.git:ro
      - go_mod_cache:/go/pkg/mod
      - go_build_cache:/root/.cache/go-build
      - ./data:/app/data
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      dragonfly:
        condition: service_healthy

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile.dev
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      # SSR load + the /api proxy route reach the co-located Go API here.
      - INTERNAL_API_URL=http://backend:3001
      # Browsers talk to the Go API directly (binary streaming + the activity
      # and live-document WebSockets — the in-process /api proxy can't upgrade
      # WS). Same-site localhost, and the backend's CORS allows :3000 via
      # ALCOVES_BASE_URL. Matches the documented production topology.
      - PUBLIC_API_ORIGIN=http://localhost:3001
      - HOME=/tmp
    volumes:
      - ./client:/app
      - client_node_modules:/app/node_modules
      # Anonymous volumes shadow the bind mount so host-side build artifacts
      # (generated when running bun dev/typecheck/playwright on the host)
      # never leak in — they bake host-absolute node_modules paths that don't
      # resolve inside the container and crash the dev server.
      - /app/.svelte-kit
      - /app/build
    ports:
      - "3000:3000"
    depends_on:
      - backend
    healthcheck:
      test:
        - "CMD"
        - "bun"
        - "-e"
        - "await fetch('http://localhost:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 120s

volumes:
  postgres_data:
  go_mod_cache:
  go_build_cache:
  client_node_modules:
