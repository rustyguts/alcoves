# Example production-style overrides. Copy to my-values.yaml and edit.

baseUrl: https://alcoves.example.com

image:
  repository: ghcr.io/rustyguts/alcoves
  tag: "0.20.0"

# Generate: openssl rand -base64 48
sessionSecret: "REPLACE_WITH_32+_BYTE_KEY"

database:
  url: postgres://alcoves:supersecret@postgres.databases.svc:5432/alcoves?sslmode=require

queue:
  host: dragonfly.cache.svc
  port: 6379

oauth:
  google:
    clientId: "your-client-id.apps.googleusercontent.com"
    clientSecret: "GOCSPX-..."

frontend:
  replicaCount: 3

backend:
  api:
    replicaCount: 3
  worker:
    replicaCount: 2
    resources:
      requests: { cpu: "1",  memory: 4Gi }
      limits:   { cpu: "8",  memory: 16Gi }

storage:
  driver: local
  persistentVolume:
    enabled: true
    storageClass: nfs-csi
    accessModes: [ReadWriteMany]
    size: 2Ti

ingress:
  enabled: true
  className: nginx
  host: alcoves.example.com
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
  tls:
    enabled: true
    secretName: alcoves-tls
