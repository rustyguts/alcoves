# Alcoves Helm values. Override anything here via -f my-values.yaml or --set.

# =============================================================================
# Image
# =============================================================================
# One unified image runs every role. The three workloads below (frontend, api,
# worker) all pull this same image and select their role via container args
# (web | api | worker) — so a version upgrade is a single image bump.
image:
  repository: ghcr.io/rustyguts/alcoves
  tag: ""                # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent

imagePullSecrets: []

# =============================================================================
# Public-facing URL
# =============================================================================
# Used for OAuth redirect callbacks and outbound share links.
baseUrl: https://alcoves.example.com

# =============================================================================
# Frontend (SvelteKit SSR)
# =============================================================================
frontend:
  enabled: true
  replicaCount: 2
  port: 3000
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: 1,    memory: 512Mi }
  podAnnotations: {}
  nodeSelector: {}
  affinity: {}
  tolerations: []

  # PUBLIC_API_ORIGIN — exposed to the browser so binary content (video,
  # images, downloads) bypasses the SvelteKit /api proxy and streams directly
  # from the API. Defaults to baseUrl, which is correct when both the SvelteKit
  # server and the API live behind the same ingress. Set to an explicit
  # https://api.example.com if you split them on different domains.
  publicApiOrigin: ""    # "" → baseUrl

# =============================================================================
# Backend API
# =============================================================================
backend:
  api:
    enabled: true
    replicaCount: 2
    port: 3001
    resources:
      requests: { cpu: 200m, memory: 512Mi }
      limits:   { cpu: 2,    memory: 2Gi }
    podAnnotations: {}
    nodeSelector: {}
    affinity: {}
    tolerations: []
    livenessProbe:
      httpGet: { path: /api/health, port: http }
      initialDelaySeconds: 20
      periodSeconds: 30
    readinessProbe:
      httpGet: { path: /api/health, port: http }
      initialDelaySeconds: 5
      periodSeconds: 5

# =============================================================================
# Backend worker (heavy jobs: ffmpeg, whisper.cpp, ONNX inference)
# Runs as a separate deployment so transcode/detect work doesn't block API.
# =============================================================================
  worker:
    enabled: true
    # Scale throughput OUT, not up: each pod runs asynq at concurrency 2 (see
    # cmd/server/main.go), so to process more jobs in parallel add replicas
    # rather than raising per-pod concurrency. More pods spread peak memory
    # across nodes and fail independently — a single fat, high-concurrency pod
    # concentrates OOM risk, which is exactly what was orphaning jobs. Default to
    # 3 workers so a couple of heavy long-runners (whisper/transcode) don't block
    # the rest of the queue.
    replicaCount: 3
    # Memory is sized for asynq concurrency 2 (two in-flight heavy jobs per pod).
    # Each is RAM-hungry: whisper medium ~2.5GB (f16 weights + KV cache), whisper
    # large ~4-5GB, plus ffmpeg transcodes and ONNX detect jobs holding decoded
    # frames/tensors. Two large jobs at once can approach ~10GB, so request 4Gi
    # for a realistic working set and cap at 12Gi to absorb a worst-case pair
    # without the kernel reaping the pod. Raise these in lockstep if you raise
    # per-pod concurrency.
    # No CPU limit — whisper.cpp + ffmpeg can soak whatever the node has, and
    # CFS throttling at a hard limit hurts more than it helps for these bursty,
    # latency-sensitive jobs. Request 2 cores for scheduling.
    resources:
      requests: { cpu: 2, memory: 4Gi }
      limits:   { memory: 12Gi }
    podAnnotations: {}
    nodeSelector: {}
    affinity: {}
    tolerations: []

# =============================================================================
# Storage — persistent volume for files, cache, model downloads
# =============================================================================
storage:
  driver: local              # local | s3
  # When driver=local the chart provisions a PVC mounted at /app/data.
  # Both api + worker pods need access — must be ReadWriteMany if replicaCount > 1.
  persistentVolume:
    enabled: true
    storageClass: ""         # "" → cluster default
    accessModes: [ReadWriteMany]
    size: 200Gi
    annotations: {}
    # If you already have a PVC, set this and the chart will reuse it.
    existingClaim: ""
  # When driver=s3, fill these. Buckets are separate prefixes.
  s3:
    bucket: ""
    region: ""
    endpoint: ""
    forcePathStyle: false
    accessKeyId: ""          # use existingSecret instead for prod
    secretAccessKey: ""
    filesPrefix: "files/"
    avatarsPrefix: "avatars/"
    cachePrefix: "cache/"
    existingSecret: ""       # secret with keys: accessKeyId, secretAccessKey

# =============================================================================
# Database (PostgreSQL + pgvector)
# =============================================================================
# This chart does NOT deploy Postgres. Point at any cluster you trust
# (CloudNativePG, Crunchy, RDS, etc.). Image must include pgvector.
database:
  url: ""                    # postgres://user:pass@host:5432/alcoves?sslmode=require
  existingSecret: ""         # secret with key `url` overrides .url

# =============================================================================
# Queue (Dragonfly / Redis-compatible) for asynq jobs
# =============================================================================
queue:
  host: dragonfly
  port: 6379
  password: ""
  existingSecret: ""         # secret with key `password`

# =============================================================================
# Sessions
# =============================================================================
# AES-GCM key, ≥32 bytes. Generate: `openssl rand -base64 48`.
sessionSecret: ""
existingSessionSecret: ""    # secret with key `sessionSecret`

# =============================================================================
# OAuth (optional)
# =============================================================================
oauth:
  google:
    clientId: ""
    clientSecret: ""
    existingSecret: ""       # secret with keys: clientId, clientSecret

# =============================================================================
# Model assets — Whisper, PANNs, YOLO, InsightFace
# Defaults point at the public bucket on s3.rustyguts.net. Override to mirror
# privately if egress matters or the public bucket is unreachable.
# =============================================================================
models:
  # Boot-time fallback for the transcription model. Admins can override at
  # runtime from /admin → Inference Models; the worker reads admin settings
  # first and falls back here when unset (fresh installs, tests). Allow-list
  # lives in backend/internal/services/transcribe/whisper_models.go.
  whisperModel: large-v3
  whisperLanguage: auto
  # Silero VAD model name. Required to suppress the repetition-loop
  # hallucination on long non-speech audio (game/music/silence).
  # Set to "" to disable (not recommended). Hosted alongside the whisper
  # model file under whisperModelBaseUrl as ggml-<name>.bin.
  whisperVadModel: silero-v6.2.0
  whisperModelBaseUrl: https://s3.rustyguts.net/models
  # Base URL for the audio-tagger ONNX bucket. The worker composes the
  # final URL by appending the registry entry's filename. Registry lives
  # in backend/internal/services/audiodetection/registry.go.
  audioDetectModelBaseUrl: https://s3.rustyguts.net/models
  audioDetectLabelsUrl: https://s3.rustyguts.net/models/audioset_class_labels_indices.csv

# =============================================================================
# Extra environment variables (advanced)
# Merged into both api + worker pods. Use for tuning face/object detection,
# overriding model paths, etc.
# =============================================================================
extraEnv: []
# - name: ALCOVES_FACE_DETECTION_MIN_SCORE
#   value: "0.6"

# =============================================================================
# Service + Ingress
# =============================================================================
service:
  type: ClusterIP
  annotations: {}

ingress:
  enabled: true
  className: nginx
  annotations:
    # Large video uploads + ranged streaming. Tune for your reverse proxy.
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
  host: alcoves.example.com
  tls:
    enabled: true
    secretName: alcoves-tls

# =============================================================================
# Pod-level options
# =============================================================================
serviceAccount:
  create: true
  annotations: {}
  name: ""

podSecurityContext: {}
securityContext: {}
