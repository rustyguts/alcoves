{{- if .Values.tests.enabled }}
{{- $standalone := eq .Values.deploymentMode "standalone" }}
{{- $webService := ternary (include "alcoves.fullname" .) (include "alcoves.frontend.fullname" .) $standalone }}
{{- $apiService := ternary (include "alcoves.fullname" .) (include "alcoves.api.fullname" .) $standalone }}
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "alcoves.fullname" . }}-test-connection
  labels:
    {{- include "alcoves.labels" . | nindent 4 }}
    app.kubernetes.io/component: test
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: healthcheck
      image: {{ .Values.tests.image }}
      command: ["sh", "-c"]
      args:
        - |
          set -ex
          {{- if or $standalone .Values.backend.api.enabled }}
          wget -q -O- http://{{ $apiService }}:{{ .Values.backend.api.port }}/api/health
          wget -q -O- http://{{ $apiService }}:{{ .Values.backend.api.port }}/api/version
          {{- end }}
          {{- if or $standalone .Values.frontend.enabled }}
          wget -q -O /dev/null http://{{ $webService }}:{{ .Values.frontend.port }}/login
          {{- end }}
{{- end }}
