{{- if and (eq .Values.deploymentMode "distributed") .Values.backend.api.enabled .Values.backend.api.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "alcoves.api.fullname" . }}
  labels:
    {{- include "alcoves.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend-api
spec:
  {{- if .Values.backend.api.podDisruptionBudget.maxUnavailable }}
  maxUnavailable: {{ .Values.backend.api.podDisruptionBudget.maxUnavailable }}
  {{- else }}
  minAvailable: {{ .Values.backend.api.podDisruptionBudget.minAvailable }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "alcoves.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: backend-api
{{- end }}
