{{- if and (eq .Values.deploymentMode "distributed") .Values.backend.api.enabled .Values.backend.api.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "alcoves.api.fullname" . }}
  labels:
    {{- include "alcoves.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "alcoves.api.fullname" . }}
  minReplicas: {{ .Values.backend.api.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.backend.api.autoscaling.maxReplicas }}
  metrics:
    {{- with .Values.backend.api.autoscaling.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ . }}
    {{- end }}
    {{- with .Values.backend.api.autoscaling.targetMemoryUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ . }}
    {{- end }}
{{- end }}
