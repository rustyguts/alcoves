{{- if and (eq .Values.deploymentMode "distributed") .Values.backend.api.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "alcoves.api.fullname" . }}
  labels:
    {{- include "alcoves.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend-api
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if not .Values.backend.api.autoscaling.enabled }}
  replicas: {{ .Values.backend.api.replicaCount }}
  {{- end }}
  {{- with .Values.backend.api.updateStrategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "alcoves.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: backend-api
  template:
    metadata:
      labels:
        {{- include "alcoves.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: backend-api
        {{- with .Values.backend.api.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        {{- if include "alcoves.appSecretNeeded" . }}
        checksum/app-secret: {{ include "alcoves.appSecretChecksum" . }}
        {{- end }}
        {{- with .Values.backend.api.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- include "alcoves.podCommon" (dict "root" $ "comp" .Values.backend.api) | nindent 6 }}
      containers:
        - name: api
          image: {{ include "alcoves.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # Unified image, api role: run only the Go HTTP API (ALCOVES_MODE=api).
          args: ["api"]
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.backend.api.port }}
              protocol: TCP
          env:
            - name: ALCOVES_MODE
              value: api
            {{- include "alcoves.backendEnv" . | nindent 12 }}
            {{- with .Values.backend.api.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.backend.api.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.backend.api.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.backend.api.resources | nindent 12 }}
          {{- if or (eq .Values.storage.driver "local") .Values.backend.api.extraVolumeMounts }}
          volumeMounts:
            {{- if eq .Values.storage.driver "local" }}
            - name: data
              mountPath: /app/data
            {{- end }}
            {{- with .Values.backend.api.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
      {{- if or (eq .Values.storage.driver "local") .Values.backend.api.extraVolumes }}
      volumes:
        {{- if eq .Values.storage.driver "local" }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ default (printf "%s-data" (include "alcoves.fullname" .)) .Values.storage.persistentVolume.existingClaim }}
        {{- end }}
        {{- with .Values.backend.api.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
{{- end }}
