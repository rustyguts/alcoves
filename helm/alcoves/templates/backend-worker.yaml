{{- if .Values.backend.worker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "alcoves.worker.fullname" . }}
  labels:
    {{- include "alcoves.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend-worker
spec:
  replicas: {{ .Values.backend.worker.replicaCount }}
  selector:
    matchLabels:
      {{- include "alcoves.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: backend-worker
  template:
    metadata:
      labels:
        {{- include "alcoves.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: backend-worker
      {{- with .Values.backend.worker.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "alcoves.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: worker
          image: {{ include "alcoves.backend.image" . }}
          imagePullPolicy: {{ .Values.image.backend.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: ALCOVES_MODE
              value: worker
            {{- include "alcoves.backendEnv" . | nindent 12 }}
          resources:
            {{- toYaml .Values.backend.worker.resources | nindent 12 }}
          {{- if eq .Values.storage.driver "local" }}
          volumeMounts:
            - name: data
              mountPath: /app/data
          {{- end }}
      {{- if eq .Values.storage.driver "local" }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ default (printf "%s-data" (include "alcoves.fullname" .)) .Values.storage.persistentVolume.existingClaim }}
      {{- end }}
      {{- with .Values.backend.worker.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.worker.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.worker.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
