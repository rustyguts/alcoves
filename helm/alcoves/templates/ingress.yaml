{{- if .Values.ingress.enabled }}
{{- /* Both deployment modes route the same way; only the backing services differ. */}}
{{- $standalone := eq .Values.deploymentMode "standalone" }}
{{- $webService := ternary (include "alcoves.fullname" .) (include "alcoves.frontend.fullname" .) $standalone }}
{{- $apiService := ternary (include "alcoves.fullname" .) (include "alcoves.api.fullname" .) $standalone }}
{{- $webPort := int .Values.frontend.port }}
{{- $apiPort := int .Values.backend.api.port }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "alcoves.fullname" . }}
  labels:
    {{- include "alcoves.labels" . | nindent 4 }}
  {{- if or .Values.ingress.annotations .Values.commonAnnotations }}
  annotations:
    {{- with .Values.commonAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          # API (auth, libraries, files, TUS uploads, MCP, streaming) goes
          # straight to the Go API — bypassing the SvelteKit proxy keeps Range
          # responses and TUS chunking intact.
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ $apiService }}
                port:
                  number: {{ $apiPort }}
          {{- if .Values.mcp.oauth.enabled }}
          # OAuth 2.1 discovery documents (RFC 8414 / RFC 9728) are served by
          # the API at the site root — without these rules they would fall
          # through to the frontend and 404.
          - path: /.well-known/oauth-authorization-server
            pathType: Prefix
            backend:
              service:
                name: {{ $apiService }}
                port:
                  number: {{ $apiPort }}
          - path: /.well-known/oauth-protected-resource
            pathType: Prefix
            backend:
              service:
                name: {{ $apiService }}
                port:
                  number: {{ $apiPort }}
          {{- end }}
          # Everything else hits the SvelteKit server (including /s/** share
          # pages, which it SSRs for OG/SEO tags).
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $webService }}
                port:
                  number: {{ $webPort }}
{{- end }}
