{{- if and (eq .Values.deploymentMode "distributed") .Values.backend.worker.enabled .Values.backend.worker.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "alcoves.worker.fullname" . }}
  labels:
    {{- include "alcoves.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend-worker
spec:
  {{- if .Values.backend.worker.podDisruptionBudget.maxUnavailable }}
  maxUnavailable: {{ .Values.backend.worker.podDisruptionBudget.maxUnavailable }}
  {{- else }}
  minAvailable: {{ .Values.backend.worker.podDisruptionBudget.minAvailable }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "alcoves.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: backend-worker
{{- end }}
