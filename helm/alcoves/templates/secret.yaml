{{- /*
A single chart-managed secret holds any credential not delegated to an
existing secret (database.existingSecret, oauth.google.existingSecret, etc.).
Skipped entirely when everything comes from existing secrets. Pods that
consume it carry a checksum annotation so credential changes roll them.
*/ -}}
{{- if include "alcoves.appSecretNeeded" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "alcoves.appSecretName" . }}
  labels:
    {{- include "alcoves.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  {{- if not .Values.existingSessionSecret }}
  ALCOVES_SESSION_SECRET: {{ required "sessionSecret or existingSessionSecret is required" .Values.sessionSecret | quote }}
  {{- end }}
  {{- if and (not .Values.database.existingSecret) .Values.database.url }}
  ALCOVES_DATABASE_URL: {{ .Values.database.url | quote }}
  {{- end }}
  {{- if and (not .Values.queue.existingSecret) .Values.queue.password }}
  ALCOVES_QUEUE_PASSWORD: {{ .Values.queue.password | quote }}
  {{- end }}
  {{- if and (not .Values.oauth.google.existingSecret) .Values.oauth.google.clientId }}
  ALCOVES_OAUTH_GOOGLE_CLIENT_ID: {{ .Values.oauth.google.clientId | quote }}
  ALCOVES_OAUTH_GOOGLE_CLIENT_SECRET: {{ .Values.oauth.google.clientSecret | quote }}
  {{- end }}
  {{- if .Values.mcp.signingSecret }}
  ALCOVES_MCP_SIGNING_SECRET: {{ .Values.mcp.signingSecret | quote }}
  {{- end }}
  {{- if and (eq .Values.storage.driver "s3") (not .Values.storage.s3.existingSecret) }}
  ALCOVES_S3_ACCESS_KEY_ID: {{ .Values.storage.s3.accessKeyId | quote }}
  ALCOVES_S3_SECRET_ACCESS_KEY: {{ .Values.storage.s3.secretAccessKey | quote }}
  {{- end }}
{{- end }}
