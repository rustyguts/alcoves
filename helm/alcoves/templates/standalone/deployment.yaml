{{- if eq .Values.deploymentMode "standalone" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "alcoves.fullname" . }}
  labels:
    {{- include "alcoves.labels" . | nindent 4 }}
    app.kubernetes.io/component: standalone
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.standalone.replicaCount }}
  {{- with .Values.standalone.updateStrategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "alcoves.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: standalone
  template:
    metadata:
      labels:
        {{- include "alcoves.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: standalone
        {{- with .Values.standalone.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        {{- if include "alcoves.appSecretNeeded" . }}
        checksum/app-secret: {{ include "alcoves.appSecretChecksum" . }}
        {{- end }}
        {{- with .Values.standalone.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- include "alcoves.podCommon" (dict "root" $ "comp" .Values.standalone) | nindent 6 }}
      containers:
        - name: alcoves
          image: {{ include "alcoves.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # Unified image, all role: SvelteKit + Go API + Asynq worker in one
          # pod, supervised by the image entrypoint. If either process dies the
          # container exits and Kubernetes restarts the whole pod.
          args: ["all"]
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http-web
              containerPort: {{ .Values.frontend.port }}
              protocol: TCP
            - name: http-api
              containerPort: {{ .Values.backend.api.port }}
              protocol: TCP
          env:
            - name: ALCOVES_MODE
              value: all
            {{- include "alcoves.backendEnv" . | nindent 12 }}
            {{- with .Values.standalone.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- /* The SvelteKit /api proxy + SSR hit the co-located Go API. */}}
            {{- include "alcoves.frontendEnv" (dict "root" $ "internalApiUrl" (printf "http://127.0.0.1:%v" .Values.backend.api.port)) | nindent 12 }}
          {{- with .Values.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.standalone.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.standalone.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.standalone.resources | nindent 12 }}
          {{- if or (eq .Values.storage.driver "local") .Values.standalone.extraVolumeMounts }}
          volumeMounts:
            {{- if eq .Values.storage.driver "local" }}
            - name: data
              mountPath: /app/data
            {{- end }}
            {{- with .Values.standalone.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
      {{- if or (eq .Values.storage.driver "local") .Values.standalone.extraVolumes }}
      volumes:
        {{- if eq .Values.storage.driver "local" }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ default (printf "%s-data" (include "alcoves.fullname" .)) .Values.storage.persistentVolume.existingClaim }}
        {{- end }}
        {{- with .Values.standalone.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
{{- end }}
