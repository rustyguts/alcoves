[project]
name = "alcoves"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "django>=5.2",
    "opentelemetry-instrumentation-django>=0.53b1",
    "opentelemetry-sdk>=1.32.1",
    "pyvips[binary]>=3.0.0",
]

[dependency-groups]
dev = [
    "django-stubs[compatible-mypy]>=5.2.0",
    "ruff>=0.11.7",
]

[tool.mypy]
plugins = ["mypy_django_plugin.main"]

[tool.django-stubs]
django_settings_module = "alcoves.settings"
