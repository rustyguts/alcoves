root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o /tmp/main cmd/server/main.go && cd web && bun install && bun run build"
bin = "/tmp/main"
include_ext = ["go", "tpl", "tmpl", "html", "js", "ts", "jsx", "tsx", "css"]
exclude_dir = ["tmp", "vendor", "web/node_modules", "node_modules", "data/uploads"]